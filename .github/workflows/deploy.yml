# The workflow reads the current task definitions and changes only the image for the relevant container

name: Build, Test, and Deploy Simple Web App to ECS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Downloads the repository code into the runner
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: app/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: app/backend
        run: |
          python -m pytest -v

  deploy:
    name: Build Images and Deploy
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
      ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_FRONTEND_SERVICE: ${{ vars.ECS_FRONTEND_SERVICE }}
      ECS_BACKEND_SERVICE: ${{ vars.ECS_BACKEND_SERVICE }}
      ECS_FRONTEND_TASK_FAMILY: ${{ vars.ECS_FRONTEND_TASK_FAMILY }}
      ECS_BACKEND_TASK_FAMILY: ${{ vars.ECS_BACKEND_TASK_FAMILY }}
      APP_URL: ${{ vars.APP_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Assumes the AWS role using GitHub OIDC
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: image
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "registry=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_OUTPUT"

      - name: Build frontend Docker image
        run: |
          docker build \
            -t "${{ steps.image.outputs.registry }}/${ECR_FRONTEND_REPOSITORY}:${{ steps.image.outputs.tag }}" \
            ./app/frontend

      - name: Build backend Docker image
        run: |
          docker build \
            -t "${{ steps.image.outputs.registry }}/${ECR_BACKEND_REPOSITORY}:${{ steps.image.outputs.tag }}" \
            ./app/backend

      - name: Push frontend Docker image
        run: |
          docker push \
            "${{ steps.image.outputs.registry }}/${ECR_FRONTEND_REPOSITORY}:${{ steps.image.outputs.tag }}"

      - name: Push backend Docker image
        run: |
          docker push \
            "${{ steps.image.outputs.registry }}/${ECR_BACKEND_REPOSITORY}:${{ steps.image.outputs.tag }}"

      # Reads the existing ECS task configuration
      - name: Create updated task definitions
        run: |
          set -euo pipefail

          REGISTRY="${{ steps.image.outputs.registry }}"
          TAG="${{ steps.image.outputs.tag }}"

          aws ecs describe-task-definition \
            --task-definition "$ECS_FRONTEND_TASK_FAMILY" \
            --query taskDefinition \
            --output json > frontend-current.json

          jq \
            --arg image "$REGISTRY/$ECR_FRONTEND_REPOSITORY:$TAG" \
            '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
            | .containerDefinitions |= map(
                if .name == "frontend"
                then .image = $image
                else .
                end
              )
            ' frontend-current.json > frontend-new.json

          aws ecs describe-task-definition \
            --task-definition "$ECS_BACKEND_TASK_FAMILY" \
            --query taskDefinition \
            --output json > backend-current.json

          jq \
            --arg image "$REGISTRY/$ECR_BACKEND_REPOSITORY:$TAG" \
            '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
            | .containerDefinitions |= map(
                if .name == "backend"
                then .image = $image
                else .
                end
              )
            ' backend-current.json > backend-new.json

          # Fail if the expected container was not found
          jq -e '.containerDefinitions[] | select(.name == "frontend")' frontend-new.json >/dev/null
          jq -e '.containerDefinitions[] | select(.name == "backend")' backend-new.json >/dev/null
          
      # Creates a new revision with the updated image
      - name: Register frontend task definition
        id: frontend-task
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://frontend-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
      
      # 1st command : Tells ECS to use the new task definition

      # 2nd command : Waits for ECS to reach a stable state
      - name: Deploy frontend service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_FRONTEND_SERVICE" \
            --task-definition "${{ steps.frontend-task.outputs.arn }}"

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_FRONTEND_SERVICE"

      - name: Register backend task definition
        id: backend-task
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://backend-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy backend service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_BACKEND_SERVICE" \
            --task-definition "${{ steps.backend-task.outputs.arn }}"

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_BACKEND_SERVICE"

      # The first request checks that the frontend is accessible. 
      # The second checks the backend health endpoint through the ALB path routing configured in your architecture.
      - name: Smoke test application
        run: |
          set -e

          curl --fail --silent --show-error \
            --retry 10 \
            --retry-connrefused \
            --retry-delay 6 \
            "$APP_URL/"

          curl --fail --silent --show-error \
            --retry 10 \
            --retry-connrefused \
            --retry-delay 6 \
            "$APP_URL/health"

      - name: Deployment summary
        if: success()
        run: |
          echo "Deployment completed."
          echo "Commit: $GITHUB_SHA"
          echo "Frontend image: ${{ steps.image.outputs.registry }}/${ECR_FRONTEND_REPOSITORY}:${{ steps.image.outputs.tag }}"
          echo "Backend image: ${{ steps.image.outputs.registry }}/${ECR_BACKEND_REPOSITORY}:${{ steps.image.outputs.tag }}"